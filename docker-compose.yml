services:
  zwj-stock-analysis:
    build:
      context: .
      dockerfile: Dockerfile
    image: zwj-stock-analysis:v2
    container_name: ZWJ_stock-analysis
    restart: unless-stopped
    # 资源上限：防止 AI 训练（xgboost/sklearn 使用 n_jobs=-1）吃满 NAS。
    # 若训练任务出现 OOM（退出码 137），把 mem_limit 调到 3g 再试。
    mem_limit: 2g
    cpus: "2"
    ports:
      - "9129:9129"
    ulimits:
      nofile:
        soft: 1024
        hard: 1024

    environment:
      SECRET_KEY: "${SECRET_KEY:?需要设置}"
      AUTH_DATA: "/data/auth"
      WEB_STOCK_PICKER_PORT: "9129"
      TZ: "Asia/Shanghai"
      REPORT_OUTPUT_DIR: "/work/app/results/reports"
    volumes:
      - /vol1/1000/docker/ZWJ_stock-analysis/app/stock_data:/work/app/stock_data
      - /vol1/1000/docker/ZWJ_stock-analysis/app/model:/work/app/model
      - /vol1/1000/docker/ZWJ_stock-analysis/app/results:/work/app/results
      - /vol1/1000/docker/ZWJ_stock-analysis/app/backtest_results:/work/app/backtest_results
      # 代码目录挂载，方便你改代码后不用重新 build 直接重启容器即可生效
      - /vol1/1000/docker/ZWJ_stock-analysis/web_stock_picker:/work/web_stock_picker
      - /vol1/1000/docker/ZWJ_stock-analysis/auth-data:/data/auth
      # 任务脚本与训练日志：代码写入 ROOT/runtime/jobs
      - /vol1/1000/docker/ZWJ_stock-analysis/runtime:/work/runtime
      # 说明：定时任务配置与通知写在 ROOT/web_stock_picker/runtime，
      # 已由上面的 web_stock_picker 整目录挂载持久化，无需单独挂载。
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9129/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
